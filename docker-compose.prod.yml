# Production Docker Compose Configuration for EC2
version: '3.8'

services:
  db:
    image: postgres:15
    container_name: kders-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kders-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kders-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      PGVECTOR_ENABLED: ${PGVECTOR_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kders-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kders-frontend
    ports:
      - "3000:3000"
    networks:
      - kders-network
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_URL=http://localhost:8000

  smtp:
    build:
      context: ./smtp_server
      dockerfile: Dockerfile
    container_name: kders-smtp
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-kders.com}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "25:25"    # SMTP receiving
      - "587:587"  # SMTP submission (sending)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kders-network
    restart: unless-stopped
    volumes:
      - ./smtp_server:/app
      - mail_data:/var/mail

  pop3:
    build:
      context: ./pop3_server
      dockerfile: Dockerfile
    container_name: kders-pop3
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "110:110"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kders-network
    restart: unless-stopped
    volumes:
      - ./pop3_server:/app

  nginx:
    image: nginx:alpine
    container_name: kders-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - kders-network
    restart: unless-stopped

networks:
  kders-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mail_data:
    driver: local
